name: Budowa aplikacji Android (APK)

# Builds the APK on GitHub's servers (they have the Android SDK) and publishes it in Releases.
# Signing: with secrets ANDROID_KEYSTORE_B64 + ANDROID_KEYSTORE_PASSWORD the APK is signed with your
# permanent key (updates install over the previous version). Without them a debug-signed APK is built.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-24.04 runners ship with the Android SDK preinstalled (ANDROID_HOME).
      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then echo "::error::Brak Android SDK na serwerze"; exit 1; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3
          ls "$ANDROID_HOME/platforms" | tail -3

      # Fails fast (in seconds, before the long build) when the signing secrets are wrong.
      - name: Kontrola klucza podpisu
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EXPECTED_SHA256: 1c35f745bd082513930be01ab7138bbafc7c2d079d36a3d51dc7311f4ec91034
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::warning::Brak sekretu ANDROID_KEYSTORE_B64 — zostanie zbudowany APK debug."; exit 0; fi
          CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n\t')
          echo "Długość ANDROID_KEYSTORE_B64: ${#CLEAN} znaków (oczekiwane: 3516). Długość hasła: ${#KEYSTORE_PASSWORD} (oczekiwane: 24)."
          if [ "${#CLEAN}" -ne 3516 ]; then
            echo "::error title=Zły sekret ANDROID_KEYSTORE_B64::Ma ${#CLEAN} znaków zamiast 3516. Wklej ponownie CAŁY długi tekst spod napisu ANDROID_KEYSTORE_B64 z pliku przewaga-podpis.txt (hasło ma 24 znaki: jeśli sekret ma 24, wartości są zamienione)."
            exit 1
          fi
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/k.jks" || { echo "::error title=Zły sekret ANDROID_KEYSTORE_B64::Tekst nie jest poprawnym base64 — wklej go ponownie w całości."; exit 1; }
          GOT=$(sha256sum "$RUNNER_TEMP/k.jks" | cut -d' ' -f1)
          if [ "$GOT" != "$EXPECTED_SHA256" ]; then echo "::error title=Zły sekret ANDROID_KEYSTORE_B64::Klucz różni się od pliku przewaga-podpis.txt — wklej ponownie."; exit 1; fi
          keytool -list -keystore "$RUNNER_TEMP/k.jks" -storepass "$KEYSTORE_PASSWORD" -alias przewaga >/dev/null 2>&1 || { echo "::error title=Zły sekret ANDROID_KEYSTORE_PASSWORD::Hasło nie pasuje do klucza. Wklej ponownie 24-znakowe hasło spod napisu ANDROID_KEYSTORE_PASSWORD."; rm -f "$RUNNER_TEMP/k.jks"; exit 1; }
          rm -f "$RUNNER_TEMP/k.jks"
          echo "Klucz podpisu poprawny."

      - name: Wersja
        id: ver
        working-directory: frontend
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build interfejsu
        working-directory: frontend
        env:
          NATIVE: "1"
          APP_VERSION: ${{ steps.ver.outputs.version }}
          DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data
        run: |
          npm install --no-audit --no-fund
          npm test
          npx vite build

      - name: Projekt Android (Capacitor) + ikony
        working-directory: frontend
        run: |
          npx cap add android 2>&1 | tail -20
          npx @capacitor/assets generate --android --iconBackgroundColor "#0e1525" --iconBackgroundColorDark "#0e1525" --splashBackgroundColor "#060912" --splashBackgroundColorDark "#060912"
          npx cap sync android
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          chmod +x android/gradlew

      - name: Build APK
        working-directory: frontend/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/step.log"
          # Report the tail of the failing command as a public annotation (visible without opening the log).
          fail() {
            BODY=$(tail -45 "$LOG" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$1::$BODY"
            exit 1
          }
          run() { local title="$1"; shift; echo "== $title"; "$@" >"$LOG" 2>&1 || fail "$title"; tail -5 "$LOG"; }
          OUT="$GITHUB_WORKSPACE/Przewaga-${{ steps.ver.outputs.version }}.apk"
          if [ -n "$KEYSTORE_B64" ]; then
            run "Gradle assembleRelease" ./gradlew --no-daemon --stacktrace assembleRelease
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks" 2>"$LOG" || fail "Dekodowanie ANDROID_KEYSTORE_B64 (sprawdź, czy wklejono cały tekst)"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
            echo "build-tools: $BT, apk: $UNSIGNED"
            run "zipalign" "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            run "apksigner sign (sprawdź ANDROID_KEYSTORE_PASSWORD)" "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias przewaga \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            run "apksigner verify" "$BT/apksigner" verify "$OUT"
            rm -f "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::Brak klucza podpisu — budowany APK debug (aktualizacje mogą wymagać odinstalowania poprzedniej wersji)."
            run "Gradle assembleDebug" ./gradlew --no-daemon --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          fi
          ls -la "$OUT"
          echo "### APK gotowy: $(basename "$OUT") ($(du -h "$OUT" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Przewaga-${{ steps.ver.outputs.version }}
          path: Przewaga-${{ steps.ver.outputs.version }}.apk

      - name: Publikacja w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Przewaga ${{ steps.ver.outputs.version }}
          body: |
            Plik APK do instalacji na Androidzie. Pobierz **Przewaga-${{ steps.ver.outputs.version }}.apk** i otwórz na telefonie.
            Przy pierwszej instalacji zezwól na instalowanie aplikacji z tego źródła.
          files: Przewaga-${{ steps.ver.outputs.version }}.apk
          make_latest: true
