name: Budowa aplikacji Android (APK)

# Builds the APK on GitHub's servers (they have the Android SDK) and publishes it in Releases.
# Signing: with secret ANDROID_KEYSTORE_PASSWORD the APK is signed with the committed encrypted key
# (updates install over the previous version). Without it a debug-signed APK is built.
on:
  push:
    branches: [main, bezpieczenstwo]
    paths:
      - "frontend/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-24.04 runners ship with the Android SDK preinstalled (ANDROID_HOME).
      - name: Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then echo "::error::Brak Android SDK na serwerze"; exit 1; fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" | tail -3
          ls "$ANDROID_HOME/platforms" | tail -3

      # The signing key is committed encrypted (PKCS#12: AES-256 + PBKDF2) in frontend/signing/.
      # Only its 24-character password is a secret. Fails fast with a clear message when it is wrong.
      - name: Kontrola klucza podpisu
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::warning::Brak sekretu ANDROID_KEYSTORE_PASSWORD — zostanie zbudowany APK debug."; exit 0; fi
          PW=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          echo "Długość hasła: ${#PW} (oczekiwane: 24)."
          keytool -list -keystore frontend/signing/przewaga-release.p12 -storetype PKCS12 -storepass "$PW" -alias przewaga >/dev/null 2>&1 || {
            echo "::error title=Zły sekret ANDROID_KEYSTORE_PASSWORD::Hasło nie pasuje do klucza (długość ${#PW}, oczekiwane 24). Wklej ponownie hasło spod napisu ANDROID_KEYSTORE_PASSWORD z pliku przewaga-podpis.txt."
            exit 1
          }
          echo "Klucz podpisu poprawny."

      - name: Wersja
        id: ver
        working-directory: frontend
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=${BASE}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build interfejsu
        working-directory: frontend
        env:
          NATIVE: "1"
          APP_VERSION: ${{ steps.ver.outputs.version }}
          DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/data
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx vite build

      - name: Projekt Android (Capacitor) + ikony
        working-directory: frontend
        run: |
          npx cap add android 2>&1 | tail -20
          npx @capacitor/assets generate --android --iconBackgroundColor "#0e1525" --iconBackgroundColorDark "#0e1525" --splashBackgroundColor "#060912" --splashBackgroundColorDark "#060912"
          npx cap sync android
          # @capacitor/background-runner ships its JavaScript engine as an .aar next to the plugin (see its docs)
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#&\n        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'#" android/app/build.gradle
          grep -q "background-runner/android/src/main/libs" android/app/build.gradle || { echo "::error::Nie udało się dodać biblioteki background-runner do build.gradle"; sed -n '/repositories/,/}/p' android/app/build.gradle; exit 1; }
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"${{ steps.ver.outputs.version }}\"/" android/app/build.gradle
          chmod +x android/gradlew

      # Privacy: @capacitor/background-runner declares location permissions (its unused Geolocation API)
      # and FOREGROUND_SERVICE; they are stripped from the merged manifest. Backup to Google Drive is
      # disabled so the coupon and settings never leave the device.
      - name: Manifest — usunięcie zbędnych uprawnień i kopii zapasowej
        working-directory: frontend
        run: |
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'xmlns:tools=' not in s:
              s = s.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          remove = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
          ]
          block = "".join(f'    <uses-permission android:name="{n}" tools:node="remove" />\n' for n in remove)
          s = s.replace("</manifest>", block + "</manifest>", 1)
          if 'android:allowBackup="true"' in s:
              s = s.replace('android:allowBackup="true"', 'android:allowBackup="false"', 1)
          elif 'android:allowBackup=' not in s:
              s = s.replace("<application", '<application android:allowBackup="false"', 1)
          if 'android:allowBackup="false"' not in s:
              raise SystemExit("::error::Nie udało się ustawić allowBackup=false")
          p.write_text(s)
          PY
          cat android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: frontend/android
        env:
          KEYSTORE_PASSWORD_RAW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          export KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD_RAW" | tr -d ' \r\n\t')
          KS="$GITHUB_WORKSPACE/frontend/signing/przewaga-release.p12"
          LOG="$RUNNER_TEMP/step.log"
          # Report the tail of the failing command as a public annotation (visible without opening the log).
          fail() {
            BODY=$(tail -45 "$LOG" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$1::$BODY"
            exit 1
          }
          run() { local title="$1"; shift; echo "== $title"; "$@" >"$LOG" 2>&1 || fail "$title"; tail -5 "$LOG"; }
          OUT="$GITHUB_WORKSPACE/Przewaga-${{ steps.ver.outputs.version }}.apk"
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            run "Gradle assembleRelease" ./gradlew --no-daemon --stacktrace assembleRelease
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
            echo "build-tools: $BT, apk: $UNSIGNED"
            run "zipalign" "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            run "apksigner sign (sprawdź ANDROID_KEYSTORE_PASSWORD)" "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-key-alias przewaga \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$OUT" "$RUNNER_TEMP/aligned.apk"
            run "apksigner verify" "$BT/apksigner" verify "$OUT"
          else
            echo "::warning::Brak klucza podpisu — budowany APK debug (aktualizacje mogą wymagać odinstalowania poprzedniej wersji)."
            run "Gradle assembleDebug" ./gradlew --no-daemon --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          fi
          ls -la "$OUT"
          echo "### APK gotowy: $(basename "$OUT") ($(du -h "$OUT" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      # Security gate: the built APK may request only the allowlisted permissions and must not allow backup.
      # A new plugin that adds a permission fails the build until the allowlist is reviewed.
      - name: Kontrola uprawnień APK
        run: |
          OUT="$GITHUB_WORKSPACE/Przewaga-${{ steps.ver.outputs.version }}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ALLOWED="android.permission.INTERNET
          android.permission.ACCESS_NETWORK_STATE
          android.permission.POST_NOTIFICATIONS
          android.permission.RECEIVE_BOOT_COMPLETED
          android.permission.WAKE_LOCK
          android.permission.SCHEDULE_EXACT_ALARM
          pl.przewaga.app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          PERMS=$("$BT/aapt2" dump permissions "$OUT" | grep "uses-permission" | grep -oE "name='[^']+'" | cut -d"'" -f2 | sort -u)
          echo "Uprawnienia w APK:"; echo "$PERMS"
          BAD=$(comm -23 <(echo "$PERMS") <(echo "$ALLOWED" | sed 's/^ *//' | sort -u))
          if [ -n "$BAD" ]; then echo "::error title=Niedozwolone uprawnienia w APK::$(echo $BAD)"; exit 1; fi
          BACKUP=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$OUT" | grep "allowBackup" || true)
          echo "allowBackup: $BACKUP"
          if [ -z "$BACKUP" ] || echo "$BACKUP" | grep -qiE "true|0xffffffff"; then echo "::error title=Kopia zapasowa włączona::allowBackup musi być false"; exit 1; fi
          echo "### Uprawnienia: $(echo $PERMS)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Przewaga-${{ steps.ver.outputs.version }}
          path: Przewaga-${{ steps.ver.outputs.version }}.apk

      # Feature branches only build (the APK is kept as a workflow artifact); releases come from main.
      - name: Publikacja w Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Przewaga ${{ steps.ver.outputs.version }}
          body: |
            Plik APK do instalacji na Androidzie. Pobierz **Przewaga-${{ steps.ver.outputs.version }}.apk** i otwórz na telefonie.
            Przy pierwszej instalacji zezwól na instalowanie aplikacji z tego źródła.
          files: Przewaga-${{ steps.ver.outputs.version }}.apk
          make_latest: true
