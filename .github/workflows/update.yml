name: Aktualizacja danych

# Morning run: full update. Afternoon run: only if the odds budget allows (the pipeline decides).
# Times are UTC (07:17 / 15:47 Polish winter time). GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "47 14 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Rodzaj aktualizacji"
        type: choice
        options: [morning, afternoon]
        default: morning

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    # First run downloads two NBA seasons from balldontlie (5 requests/min): ~6 minutes of pauses.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Zależności Pythona
        run: pip install -r pipeline/requirements.txt

      - name: Rodzaj przebiegu
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H)" -lt 12 ]; then
            echo "kind=morning" >> "$GITHUB_OUTPUT"
          else
            echo "kind=afternoon" >> "$GITHUB_OUTPUT"
          fi

      - name: Pobranie danych, analiza, eksport JSON
        working-directory: pipeline
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          BALLDONTLIE_KEY: ${{ secrets.BALLDONTLIE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          PRZEWAGA_PUBLISH_DIR: ${{ runner.temp }}/publish
        run: |
          set -o pipefail
          python -m app.cli run --kind ${{ steps.kind.outputs.kind }} | tee "$RUNNER_TEMP/summary.json"
          # Surface provider problems as public annotations + job summary.
          python - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, os, sys
          s = json.load(open(sys.argv[1]))
          for e in s.get("errors", [])[:10]:
              print(f"::warning title=Pipeline::{e}")
          print(f"::notice title=Pipeline::mecze {s.get('fixtures')} | historia CSV {s.get('csv_history')} | kursy {s.get('odds_matched')} | wydarzenia w JSON {s.get('events')} | nowe typy {s.get('new')}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("### Wynik aktualizacji\n")
              for k in ("fixtures", "csv_history", "scores", "odds_matched", "settled", "new", "updated", "withdrawn", "events", "history"):
                  out.write(f"- **{k}**: {s.get(k)}\n")
              out.write(f"- **błędy**: {len(s.get('errors', []))}\n")
              for e in s.get("errors", []):
                  out.write(f"  - {e}\n")
          PY

      - name: Zapis historii (baza SQLite) w repozytorium
        run: |
          git config user.name "przewaga-bot"
          git config user.email "przewaga-bot@users.noreply.github.com"
          git add pipeline/data/przewaga.sqlite3
          if ! git diff --cached --quiet; then
            git commit -m "dane: aktualizacja ${{ steps.kind.outputs.kind }} $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Push to the branch the workflow runs on (main on schedule; a feature branch when started by hand).
            for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
          fi

      # The app downloads https://raw.githubusercontent.com/<repo>/data/*.json.
      # The `data` branch holds only the latest JSON (force-pushed) so the repository does not grow.
      - name: Publikacja analiz dla aplikacji (gałąź data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "${{ runner.temp }}/publish"
          git init -q -b data
          git add .
          git -c user.name="przewaga-bot" -c user.email="przewaga-bot@users.noreply.github.com" commit -qm "analizy $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" data
