name: Sonda źródeł (tymczasowa)
on:
  push:
    branches: [kontuzje-clubelo]
    paths: ["pipeline/tools/probe_injuries_elo.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - run: python pipeline/tools/probe_injuries_elo.py
      - run: |
          git config user.name "przewaga-bot"; git config user.email "przewaga-bot@users.noreply.github.com"
          git add pipeline/tests/data/nba_injury_words.json && git commit -m "test: próbka raportu kontuzji NBA (słowa z pozycjami) [skip ci]" && git push origin HEAD:kontuzje-clubelo || true
