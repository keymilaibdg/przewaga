name: Backtest i kalibracja

# Full walk-forward backtest + calibration (monthly) and a weekly refresh of the cup ratings.
# Results are committed to the branch the workflow runs on: pipeline/app/calibration.json (read by the daily
# pipeline), pipeline/app/cup_ratings.json, pipeline/backtest/*.json and docs/BACKTEST.md.
on:
  schedule:
    - cron: "30 4 1 * *"   # 1st day of the month: full backtest
    - cron: "40 5 * * 1"   # Mondays: cup ratings only (before the morning data update)
  workflow_dispatch:
    inputs:
      job:
        description: "Zakres"
        type: choice
        options: [run, ratings]
        default: run
  push:
    branches: [kontuzje-clubelo]
    paths:
      - "pipeline/app/backtest/**"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Zależności Pythona
        run: pip install -r pipeline/requirements.txt

      - name: Zakres
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "40 5 * * 1" ]; then
            echo "job=ratings" >> "$GITHUB_OUTPUT"
          else
            echo "job=run" >> "$GITHUB_OUTPUT"
          fi

      # Downloaded archives (finished seasons never change). A new cache entry is saved after every run.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: pipeline/backtest/cache
          key: backtest-raw-${{ github.run_id }}
          restore-keys: backtest-raw-

      - name: Backtest / ratingi
        working-directory: pipeline
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          set -o pipefail
          python -m app.backtest ${{ steps.job.outputs.job }} | tee "$RUNNER_TEMP/out.json"
          if [ -f ../docs/BACKTEST.md ] && [ "${{ steps.job.outputs.job }}" = "run" ]; then
            sed -n '/## Werdykt/,/## Metoda/p' ../docs/BACKTEST.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Zapis wyników w repozytorium
        run: |
          git config user.name "przewaga-bot"
          git config user.email "przewaga-bot@users.noreply.github.com"
          for f in pipeline/app/calibration.json pipeline/app/cup_ratings.json pipeline/app/price_buckets.json pipeline/backtest/results.json pipeline/backtest/backtest.json pipeline/backtest/data docs/BACKTEST.md; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "backtest: ${{ steps.job.outputs.job }} $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
          fi
